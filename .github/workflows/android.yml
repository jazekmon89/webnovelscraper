# Builds the Android app in android/ and publishes the APK on the "android" release,
# so it can be downloaded straight to a phone:
# https://github.com/jazekmon89/webnovelscraper/releases/download/android/rr-snapshot.apk
name: Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - android/**
      - .github/workflows/android.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # On failure, repeat the compiler errors as annotations, which are readable
      # without opening the log
      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug 2>&1 | tee build.log || {
            grep -E "^e: |error:|What went wrong" -A2 build.log | head -30 | sed 's/^/::error::/'
            exit 1
          }

      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk rr-snapshot.apk
          gh release view android > /dev/null 2>&1 || gh release create android --prerelease \
            --title "RR Snapshot Android app" --notes "Latest build of the app in android/. Install rr-snapshot.apk on the phone."
          gh release upload android rr-snapshot.apk --clobber
