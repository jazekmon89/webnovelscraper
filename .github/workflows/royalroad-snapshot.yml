# Scrapes the Royal Road lists every 30 minutes and publishes them as JSON on the
# "data" branch, which the API reads (see src/novels/scrapper/royalroadScrapper.js).
# Royal Road's Cloudflare challenge only lets a headful Google Chrome through,
# so the scraper runs real Chrome under Xvfb.
name: Royal Road snapshot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/snapshot-royalroad.js
      - .github/workflows/royalroad-snapshot.yml

permissions:
  contents: write

concurrency:
  group: royalroad-snapshot

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --omit=dev
          npm install --no-save playwright-core@1.56.1

      # Start from the previous snapshot so a page that fails to load keeps its old data
      - name: Load previous snapshot
        run: git clone --depth 1 --branch data "https://github.com/${{ github.repository }}.git" data-out || mkdir data-out

      - name: Scrape Royal Road
        run: xvfb-run -a -s "-screen 0 1366x768x24" node scripts/snapshot-royalroad.js data-out/royalroad

      # The data branch keeps a single commit so its history doesn't grow
      - name: Publish snapshot
        working-directory: data-out
        run: |
          rm -rf .git
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Royal Road snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:data
