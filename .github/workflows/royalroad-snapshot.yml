# Scrapes the Royal Road lists every 30 minutes and publishes them as JSON on the
# "data" branch, which the API reads (see src/novels/scrapper/royalroadScrapper.js).
# Royal Road's Cloudflare challenge only lets a headful Google Chrome through, and only
# from some runner IPs, so several runners try in parallel and whichever get through
# scrape the pages (see scripts/snapshot-royalroad.js).
name: Royal Road snapshot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/snapshot-royalroad.js
      - .github/workflows/royalroad-snapshot.yml

permissions:
  contents: write

concurrency:
  group: royalroad-snapshot

jobs:
  # The Android app (android/) normally keeps the snapshot fresh from a phone, so the
  # scheduled runs only scrape when its data is over an hour old
  check:
    runs-on: ubuntu-24.04
    outputs:
      stale: ${{ steps.age.outputs.stale }}
    steps:
      - id: age
        run: |
          updated=$(curl -sf https://raw.githubusercontent.com/${{ github.repository }}/data/royalroad/latest-1.json | jq -r '.updatedAt // empty') || true
          age=$(( $(date +%s) - $(date -d "${updated:-1970-01-01}" +%s) ))
          if [ "$GITHUB_EVENT_NAME" != schedule ] || [ "$age" -gt 3600 ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Snapshot is $((age / 60)) minutes old; skipping"
          fi

  scrape:
    needs: check
    if: needs.check.outputs.stale == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --omit=dev
          npm install --no-save playwright-core@1.56.1

      - name: Scrape Royal Road
        env:
          SNAPSHOT_OFFSET: ${{ matrix.runner }}
        run: xvfb-run -a -s "-screen 0 1366x768x24" node scripts/snapshot-royalroad.js out

      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ matrix.runner }}
          path: out/*.json
          if-no-files-found: ignore
          retention-days: 1

  publish:
    needs: [check, scrape]
    if: always() && needs.check.outputs.stale == 'true'
    runs-on: ubuntu-24.04
    steps:
      # Start from the previous snapshot so a page that failed keeps its old data
      - name: Load previous snapshot
        run: git clone --depth 1 --branch data "https://github.com/${{ github.repository }}.git" data-out || mkdir data-out

      - uses: actions/download-artifact@v4
        with:
          pattern: snapshot-*
          path: data-out/royalroad
          merge-multiple: true

      # The data branch keeps a single commit so its history doesn't grow
      - name: Publish snapshot
        working-directory: data-out
        run: |
          rm -rf .git
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Royal Road snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:data
